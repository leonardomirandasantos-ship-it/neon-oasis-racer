<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Oasis Racer — V8 Stable</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#0d0b2b;font-family:'Trebuchet MS',system-ui,sans-serif}
  #game{display:block;width:100vw;height:100vh;touch-action:none}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .card{pointer-events:auto;background:rgba(13,11,43,.92);border:2px solid #1fd6ff;border-radius:16px;box-shadow:0 0 24px rgba(31,214,255,.5),0 0 60px rgba(255,47,185,.25);padding:26px 30px;max-width:560px;color:#eaf6ff;text-align:center}
  .card h1{margin:0 0 6px;font-size:30px;letter-spacing:2px;color:#fff;text-shadow:0 0 10px #1fd6ff,0 0 22px #ff2fb9}.card h2{margin:0 0 14px;font-size:16px;font-weight:400;color:#b9a9ff}
  .keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}.key{background:#1a1540;border:1px solid #8b3dff;border-radius:8px;padding:8px 12px;font-size:13px;color:#eaf6ff}.key b{color:#ffd23f}
  .btn{pointer-events:auto;margin-top:12px;background:linear-gradient(180deg,#ff7a1a,#ff3d81);border:none;color:#fff;font-size:18px;font-weight:bold;letter-spacing:1px;padding:12px 28px;border-radius:30px;cursor:pointer;box-shadow:0 0 18px rgba(255,122,26,.7)}.small{font-size:12px;color:#8f86c9;margin-top:10px;line-height:1.5}
  #mobileControls{display:none;position:fixed;inset:0;z-index:50;pointer-events:none;touch-action:none}.mobile-steer{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));width:min(29vw,180px);height:min(24vh,150px);border:1.5px solid rgba(255,255,255,.22);border-radius:26px;background:rgba(8,10,25,.30);color:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;font:800 clamp(28px,8vw,50px) system-ui,sans-serif;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(2px)}
  #mobileLeft{left:max(12px,env(safe-area-inset-left))}#mobileRight{right:max(12px,env(safe-area-inset-right))}.mobile-steer.pressed{background:rgba(255,255,255,.14);transform:scale(.97)}
  #mobileNitro{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 2px));transform:translateX(-50%);width:78px;height:78px;border-radius:50%;border:1.5px solid rgba(0,220,255,.72);background:rgba(0,170,220,.24);color:#fff;font:900 11px system-ui,sans-serif;letter-spacing:.6px;box-shadow:0 0 26px rgba(0,210,255,.18);pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent}.mobile-steer.pressed{background:rgba(255,255,255,.14)}#mobileNitro.pressed{background:rgba(0,220,255,.44);box-shadow:0 0 36px rgba(0,220,255,.34)}
  @media (pointer:coarse),(max-width:900px){#mobileControls{display:block}}@media (pointer:coarse) and (orientation:portrait){.mobile-steer{width:31vw;height:17vh;bottom:max(12px,env(safe-area-inset-bottom))}#mobileNitro{width:72px;height:72px;bottom:max(15px,calc(env(safe-area-inset-bottom) + 2px))}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"><div class="card" id="startCard"><h1>NEON OASIS RACER</h1><h2>Protótipo · Game Feel Test</h2><div class="keys"><div class="key"><b>← →</b> Toque = suave · Segure = derrapa</div><div class="key"><b>↑ / Espaço</b> Nitro</div><div class="key"><b>R</b> Reiniciar</div></div><p class="small"><b>1ª corrida:</b> você corre sozinho e define seu tempo.<br><b>Da 2ª em diante:</b> aparece um fantasma da sua corrida anterior ~2% mais rápido.<br>Passe pela <b>rampa</b> e corra <b>3 voltas</b>.</p><button class="btn" id="startBtn">CORRER 🏁</button></div></div>
<script>
"use strict";
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);
const TILT=.66,ZOOM=1,keys={};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR')startRace()});addEventListener('keyup',e=>keys[e.code]=false);
window.__neonMobileKey=(code,value)=>keys[code]=!!value;window.__neonMobileNitroToggle=()=>{car.nitroAuto=!car.nitroAuto;if(car.nitroAuto)keys.Space=false};window.__neonMobileNitroActive=()=>!!car.nitroAuto;
// Pista simples: duas retas longas + quatro curvas suaves.
const CP=[[420,420],[1420,420],[1720,650],[1720,1050],[1420,1280],[420,1280],[120,1050],[120,650]];
function catmull(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3)}
const POLY=[];(function(){const n=CP.length,steps=44;for(let i=0;i<n;i++){const p0=CP[(i-1+n)%n],p1=CP[i],p2=CP[(i+1)%n],p3=CP[(i+2)%n];for(let s=0;s<steps;s++){const t=s/steps;POLY.push([catmull(p0[0],p1[0],p2[0],p3[0],t),catmull(p0[1],p1[1],p2[1],p3[1],t)])}}})();
const NP=POLY.length,TAN=POLY.map((p,i)=>{const b=POLY[(i+1)%NP];return Math.atan2(b[1]-p[1],b[0]-p[0])}),TRACK_W=190,HALF=95,EDGE_TOL=22,RAMP=[.60,.66];
function inRange(p,r){p=(p%1+1)%1;return p>=r[0]&&p<=r[1]};function nearest(x,y){let bi=0,bd=1e18;for(let i=0;i<NP;i++){const dx=POLY[i][0]-x,dy=POLY[i][1]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}return{index:bi,dist:Math.sqrt(bd),progress:bi/NP}}
function polyAt(prog){prog=(prog%1+1)%1;const f=prog*NP,i=Math.floor(f)%NP,fr=f-Math.floor(f),a=POLY[i],b=POLY[(i+1)%NP];return[a[0]+(b[0]-a[0])*fr,a[1]+(b[1]-a[1])*fr,TAN[i]]}
const CRUISE=360,BOOST=560,TURN_MIN=1.5,TURN_MAX=3.6,HOP_DUR=.7,IMPROVE=1.02,car={};
function resetCar(){const s=polyAt(0);Object.assign(car,{x:s[0],y:s[1],angle:s[2],speed:0,drift:0,offT:0,nitro:[100,100,100],active:0,boosting:false,nitroAuto:false,steerHold:0,lastSteer:0,hopT:0,scale:1,wasRamp:false})}
function updateNitro(dt){const manual=keys.ArrowUp||keys.Space,want=manual||car.nitroAuto;car.boosting=false;if(want){if(!car.nitroAuto&&car.nitro[car.active]<=1){let f=-1;for(let k=1;k<=3;k++){const j=(car.active+k)%3;if(car.nitro[j]>1){f=j;break}}if(f>=0)car.active=f}if(car.nitro[car.active]>1){car.nitro[car.active]-=42*dt;if(car.nitro[car.active]<0)car.nitro[car.active]=0;car.boosting=true}else if(car.nitroAuto)car.nitroAuto=false}for(let i=0;i<3;i++){if(car.boosting&&i===car.active)continue;car.nitro[i]=Math.min(100,car.nitro[i]+9*dt)}}
let personalBest=null,curRun=[],ghostActive=false;const ghost={x:0,y:0,angle:0,rp:0,visible:false};function sampleRun(run,T){const pts=run.pts;T=Math.max(0,Math.min(run.dur,T));let lo=0,hi=pts.length-1;while(lo<hi){const m=(lo+hi)>>1;if(pts[m].t<T)lo=m+1;else hi=m}const i=Math.max(1,lo),a=pts[i-1],b=pts[i],fr=(T-a.t)/((b.t-a.t)||1e-6);return{x:a.x+(b.x-a.x)*fr,y:a.y+(b.y-a.y)*fr,ang:a.ang,rp:a.rp+(b.rp-a.rp)*fr}}
function updateGhost(){if(!ghostActive||!personalBest){ghost.visible=false;return}const g=sampleRun(personalBest,raceTime*IMPROVE);Object.assign(ghost,{x:g.x,y:g.y,angle:g.ang,rp:g.rp,visible:true})}
const TOTAL_LAPS=3;let state='menu',raceTime=0,lapTime=0,lapsDone=0,lastProg=0,raceProg=0,cdT=0,bestLap=Infinity;
function startRace(){resetCar();resize();state='countdown';cdT=3.2;raceTime=0;lapTime=0;lapsDone=0;raceProg=0;lastProg=nearest(car.x,car.y).progress;bestLap=Infinity;curRun=[];ghostActive=personalBest!==null;ghost.visible=false;document.getElementById('startCard').style.display='none';const f=document.getElementById('finishCard');if(f)f.remove()}
document.getElementById('startBtn').addEventListener('click',startRace);
function respawnCurve(nr){const g=polyAt(nr.progress);Object.assign(car,{x:g[0],y:g[1],angle:g[2],speed:CRUISE*.6,offT:0,drift:0})}
function update(dt){if(state==='countdown'){cdT-=dt;if(cdT<=0){state='racing';raceTime=0;lapTime=0}return}if(state!=='racing')return;raceTime+=dt;lapTime+=dt;updateNitro(dt);const steer=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);if(steer&&steer===car.lastSteer)car.steerHold+=dt;else car.steerHold=0;car.lastSteer=steer;const holdRamp=Math.min(1,car.steerHold/.4),turnRate=TURN_MIN+(TURN_MAX-TURN_MIN)*holdRamp,spdFactor=Math.min(1,car.speed/(CRUISE*.35));car.angle+=steer*turnRate*dt*spdFactor;const drifting=steer!==0&&car.speed>CRUISE*.45,targetDrift=drifting?steer*(.14+.34*holdRamp):0;car.drift+=(targetDrift-car.drift)*Math.min(1,dt*10);let target=car.boosting?BOOST:CRUISE;target*=(1-(drifting?(0.10+.24*holdRamp):0));const nr=nearest(car.x,car.y),prog=nr.progress,onTrack=nr.dist<HALF+EDGE_TOL;if(!car.wasRamp&&inRange(prog,RAMP)&&car.speed>CRUISE*.4)car.hopT=HOP_DUR;car.wasRamp=inRange(prog,RAMP);if(car.hopT>0){car.hopT-=dt;const e=1-car.hopT/HOP_DUR;car.scale=1+Math.sin(Math.PI*e)*.42;target*=.9}else car.scale+=(1-car.scale)*Math.min(1,dt*12);if(!onTrack){target*=.3;car.offT+=dt;if(car.offT>.4)respawnCurve(nr)}else car.offT=0;car.speed+=(target-car.speed)*Math.min(1,dt*(target>car.speed?3.2:5.2));if(car.speed<0)car.speed=0;car.x+=Math.cos(car.angle)*car.speed*dt;car.y+=Math.sin(car.angle)*car.speed*dt;if(lastProg>.85&&prog<.15){lapsDone++;lapTime<bestLap&&(bestLap=lapTime);lapTime=0;if(lapsDone>=TOTAL_LAPS){finishRace();return}}lastProg=prog;raceProg=lapsDone+prog;curRun.push({x:car.x,y:car.y,ang:car.angle,rp:raceProg,t:raceTime});updateGhost()}
function finishRace(){state='finished';const run={dur:raceTime,pts:curRun.slice()};let win=null;if(personalBest)win=raceTime<=personalBest.dur/IMPROVE;const improved=!personalBest||run.dur<personalBest.dur;if(improved)personalBest=run;const ov=document.getElementById('overlay'),div=document.createElement('div');div.className='card';div.id='finishCard';div.innerHTML='<h1>🏁 CHEGADA!</h1><div class="res">Tempo: <b>'+fmt(raceTime)+'</b></div><div class="small">Melhor volta: '+fmt(bestLap)+'</div><div class="badge">'+(improved?'NOVO MELHOR TEMPO':'Fantasma salvo para a próxima corrida')+'</div><br><button class="btn" id="againBtn">CORRER DE NOVO 🔁</button>';ov.appendChild(div);document.getElementById('againBtn').addEventListener('click',startRace)}
function fmt(t){if(!isFinite(t))return'--:--';const m=Math.floor(t/60),s=t%60;return(m?m+':':'')+(s<10&&m?'0':'')+s.toFixed(2)}
function render(){ctx.fillStyle='#0d0b2b';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(ZOOM,ZOOM*TILT);ctx.translate(-car.x,-car.y);drawBackdrop();drawTrack();if(ghost.visible)drawCarShape(ghost.x,ghost.y,ghost.angle,0,'#1fd6ff',.5,1,true);drawCarShape(car.x,car.y,car.angle,car.drift,'#ffcf6b',1,car.scale,false);ctx.restore();drawHUD();if(state==='countdown')drawCountdown()}
function drawBackdrop(){ctx.strokeStyle='rgba(90,70,150,.14)';ctx.lineWidth=1;for(let gx=-200;gx<2200;gx+=110){ctx.beginPath();ctx.moveTo(gx,-300);ctx.lineTo(gx,1700);ctx.stroke()}for(let gy=-300;gy<1700;gy+=110){ctx.beginPath();ctx.moveTo(-200,gy);ctx.lineTo(2200,gy);ctx.stroke()}const palms=[[110,170,'#ff2fb9'],[1900,240,'#1fd6ff'],[1920,970,'#ff2fb9'],[1450,1300,'#8b3dff'],[460,1320,'#1fd6ff'],[110,970,'#ffae2b'],[55,520,'#ff2fb9'],[1800,660,'#8b3dff'],[900,130,'#1fd6ff']];palms.forEach(d=>{ctx.save();ctx.shadowColor=d[2];ctx.shadowBlur=16;ctx.strokeStyle=d[2];ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(d[0],d[1]+34);ctx.lineTo(d[0],d[1]-6);ctx.stroke();for(let a=0;a<5;a++){const ang=-Math.PI/2+(a-2)*.5;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(d[0],d[1]-6);ctx.quadraticCurveTo(d[0]+Math.cos(ang)*18,d[1]-6+Math.sin(ang)*18,d[0]+Math.cos(ang)*30,d[1]-2+Math.sin(ang)*30);ctx.stroke()}ctx.restore()})}
function strokePoly(off=0){ctx.beginPath();for(let i=0;i<=NP;i++){const j=i%NP,t=TAN[j];let x=POLY[j][0],y=POLY[j][1];if(off){x+=Math.cos(t+Math.PI/2)*off;y+=Math.sin(t+Math.PI/2)*off}i?ctx.lineTo(x,y):ctx.moveTo(x,y)}}
function drawTrack(){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='rgba(255,47,185,.20)';ctx.lineWidth=TRACK_W+22;strokePoly();ctx.stroke();ctx.strokeStyle='#303047';ctx.lineWidth=TRACK_W;strokePoly();ctx.stroke();ctx.save();ctx.shadowColor='#1fd6ff';ctx.shadowBlur=8;ctx.strokeStyle='#1fd6ff';ctx.lineWidth=5;strokePoly(HALF-3);ctx.stroke();ctx.restore();ctx.save();ctx.shadowColor='#ff2fb9';ctx.shadowBlur=8;ctx.strokeStyle='#ff2fb9';ctx.lineWidth=5;strokePoly(-(HALF-3));ctx.stroke();ctx.restore();ctx.setLineDash([34,28]);ctx.strokeStyle='rgba(255,174,43,.72)';ctx.lineWidth=4;strokePoly();ctx.stroke();ctx.setLineDash([]);drawRamp();drawFinish()}
function drawRamp(){const i0=Math.floor(RAMP[0]*NP),i1=Math.ceil(RAMP[1]*NP);ctx.strokeStyle='#4a4080';ctx.lineWidth=TRACK_W-6;ctx.lineCap='butt';ctx.beginPath();for(let i=i0;i<=i1;i++){const j=i%NP;i===i0?ctx.moveTo(POLY[j][0],POLY[j][1]):ctx.lineTo(POLY[j][0],POLY[j][1])}ctx.stroke();ctx.lineCap='round';ctx.save();ctx.shadowColor='#8b3dff';ctx.shadowBlur=12;ctx.strokeStyle='#b98bff';ctx.lineWidth=7;drawZoneOff(RAMP,HALF-4);drawZoneOff(RAMP,-HALF+4);ctx.restore();const c0=RAMP[0]+.006,c1=RAMP[1]-.006;ctx.save();ctx.shadowColor='#1fd6ff';ctx.shadowBlur=14;ctx.strokeStyle='#1fd6ff';ctx.lineWidth=8;for(let k=0;k<4;k++){const g=polyAt(c0+(c1-c0)*(k/4)),t=g[2],nx=Math.cos(t+Math.PI/2),ny=Math.sin(t+Math.PI/2),fx=Math.cos(t),fy=Math.sin(t),w=HALF-18,len=20;ctx.beginPath();ctx.moveTo(g[0]-nx*w-fx*len,g[1]-ny*w-fy*len);ctx.lineTo(g[0]+fx*len,g[1]+fy*len);ctx.lineTo(g[0]+nx*w-fx*len,g[1]+ny*w-fy*len);ctx.stroke()}ctx.restore()}
function drawZoneOff(r,off){ctx.beginPath();const i0=Math.floor(r[0]*NP),i1=Math.ceil(r[1]*NP);for(let i=i0;i<=i1;i++){const j=i%NP,t=TAN[j],x=POLY[j][0]+Math.cos(t+Math.PI/2)*off,y=POLY[j][1]+Math.sin(t+Math.PI/2)*off;i===i0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
function drawFinish(){const g=polyAt(.001),t=g[2],nx=Math.cos(t+Math.PI/2),ny=Math.sin(t+Math.PI/2),sq=14;for(let r=-1;r<=1;r++)for(let s=-7;s<7;s++){ctx.fillStyle=((r+s)&1)?'#eaf6ff':'#1a1540';const cx=g[0]+nx*s*sq+Math.cos(t)*r*sq,cy=g[1]+ny*s*sq+Math.sin(t)*r*sq;ctx.fillRect(cx-sq/2,cy-sq/2,sq,sq)}}
function drawCarShape(x,y,ang,drift,glow,alpha,scale,isGhost){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);if(scale>1.02){ctx.fillStyle='#000';ctx.globalAlpha=alpha*.22;ctx.beginPath();ctx.ellipse(0,12,26,9,0,0,7);ctx.fill();ctx.globalAlpha=alpha}ctx.rotate(ang+drift);ctx.scale(scale,scale);if(car.boosting&&!isGhost){ctx.fillStyle='#ff7a1a';ctx.shadowColor='#ff7a1a';ctx.shadowBlur=22;ctx.beginPath();ctx.moveTo(-22,-7);ctx.lineTo(-60,0);ctx.lineTo(-22,7);ctx.closePath();ctx.fill();ctx.shadowBlur=0}ctx.shadowColor=glow;ctx.shadowBlur=isGhost?18:12;const grd=ctx.createLinearGradient(-24,0,24,0);grd.addColorStop(0,isGhost?'#38dfff':'#5a553f');grd.addColorStop(1,isGhost?'#9ff3ff':'#a99d77');ctx.fillStyle=grd;ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(15,-14);ctx.lineTo(-19,-13);ctx.lineTo(-24,-7);ctx.lineTo(-24,7);ctx.lineTo(-19,13);ctx.lineTo(15,14);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=isGhost?'rgba(180,240,255,.5)':'rgba(25,30,60,.92)';ctx.beginPath();ctx.moveTo(7,-9);ctx.lineTo(-6,-9);ctx.lineTo(-10,0);ctx.lineTo(-6,9);ctx.lineTo(7,9);ctx.lineTo(10,0);ctx.closePath();ctx.fill();if(!isGhost){ctx.fillStyle='#141018';ctx.fillRect(-16,-17,11,5);ctx.fillRect(-16,12,11,5);ctx.fillRect(9,-17,11,5);ctx.fillRect(9,12,11,5);ctx.fillStyle='#ffe9a8';ctx.fillRect(22,-7,3,4);ctx.fillRect(22,3,3,4)}ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawHUD(){const portrait=H>W,compact=W<700;const top=12;ctx.save();ctx.fillStyle='rgba(13,11,43,.78)';roundRect(12,top,compact?185:220,compact?65:72,12);ctx.fill();ctx.strokeStyle='rgba(31,214,255,.35)';ctx.stroke();ctx.fillStyle='#b9a9ff';ctx.font='11px Trebuchet MS';ctx.fillText('VOLTA',22,top+22);ctx.fillStyle='#fff';ctx.font='bold 24px Trebuchet MS';ctx.fillText(Math.min(lapsDone+(state==='racing'?1:0),TOTAL_LAPS)+' / '+TOTAL_LAPS,22,top+49);ctx.fillStyle='#b9a9ff';ctx.font='11px Trebuchet MS';ctx.fillText('TEMPO',compact?105:125,top+22);ctx.fillStyle='#1fd6ff';ctx.font='bold 19px Trebuchet MS';ctx.fillText(fmt(raceTime),compact?105:125,top+47);ctx.restore();const bx=W/2-58,by=14;for(let i=0;i<3;i++){const x=bx+i*40,val=Math.max(0,Math.min(1,car.nitro[i]/100));ctx.save();ctx.shadowColor=car.boosting&&i===car.active?'#ffd23f':'#1fd6ff';ctx.shadowBlur=car.boosting&&i===car.active?14:7;ctx.strokeStyle=car.boosting&&i===car.active?'#ffd23f':'#1fd6ff';ctx.lineWidth=2;roundRect(x,by,34,48,6);ctx.stroke();ctx.fillStyle=val>.05?'rgba(31,214,255,.85)':'rgba(255,47,185,.5)';ctx.fillRect(x+3,by+45-val*42,28,val*42);ctx.restore()}const mw=145,mh=108,mx=W-mw-14,my=14;ctx.save();ctx.fillStyle='rgba(13,11,43,.78)';roundRect(mx,my,mw,mh,12);ctx.fill();ctx.strokeStyle='rgba(255,47,185,.45)';ctx.stroke();const minX=80,maxX=1760,minY=380,maxY=1320,mp=(p)=>[mx+10+(p[0]-minX)/(maxX-minX)*(mw-20),my+10+(p[1]-minY)/(maxY-minY)*(mh-20)];ctx.strokeStyle='#7770a0';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=NP;i++){const p=mp(POLY[i%NP]);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke();let cp=mp([car.x,car.y]);ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(cp[0],cp[1],5,0,7);ctx.fill();if(ghost.visible){const gp=mp([ghost.x,ghost.y]);ctx.fillStyle='#1fd6ff';ctx.beginPath();ctx.arc(gp[0],gp[1],4,0,7);ctx.fill()}ctx.restore();ctx.textAlign='center';ctx.fillStyle=car.boosting?'#ffd23f':'#1fd6ff';ctx.font='bold 19px Trebuchet MS';ctx.fillText(Math.round(car.speed/2.6)+' km/h',W/2,H-(portrait?78:28));ctx.textAlign='left'}
function drawCountdown(){const n=Math.ceil(cdT-.2);ctx.save();ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#ff2fb9';ctx.shadowBlur=30;ctx.font='bold 110px Trebuchet MS';ctx.fillText(n>0?n:'GO!',W/2,H/2+30);ctx.restore()}
let last=performance.now();function frame(now){let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(state==='racing'||state==='countdown')update(dt);render();requestAnimationFrame(frame)}resize();resetCar();requestAnimationFrame(frame)
})();
</script>
<div id="mobileControls" aria-label="Controles mobile"><div id="mobileLeft" class="mobile-steer">◀</div><div id="mobileRight" class="mobile-steer">▶</div><button id="mobileNitro" type="button">NITRO</button></div>
<script>
(function(){const L=document.getElementById('mobileLeft'),R=document.getElementById('mobileRight'),N=document.getElementById('mobileNitro');function key(c,v){if(window.__neonMobileKey)window.__neonMobileKey(c,v)}function steer(el,c){const d=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('pressed');key(c,true)},u=e=>{e.preventDefault();el.classList.remove('pressed');key(c,false)};el.addEventListener('pointerdown',d,{passive:false});el.addEventListener('pointerup',u,{passive:false});el.addEventListener('pointercancel',u,{passive:false});el.addEventListener('lostpointercapture',u,{passive:false})}steer(L,'ArrowLeft');steer(R,'ArrowRight');N.addEventListener('pointerdown',e=>{e.preventDefault();N.classList.add('pressed');if(window.__neonMobileNitroToggle)window.__neonMobileNitroToggle()},{passive:false});N.addEventListener('pointerup',e=>{e.preventDefault();N.classList.remove('pressed')},{passive:false});N.addEventListener('pointercancel',e=>{N.classList.remove('pressed')},{passive:false})})();
</script>
</body></html>
